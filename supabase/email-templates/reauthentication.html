<div style="background: #f2f5ef; padding: 32px 16px; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; margin: 0 auto; background: #ffffff; border-radius: 20px; overflow: hidden; border: 1px solid #E4E9DF;">
    <tr>
      <td style="background: #21382b; padding: 24px 32px;">
        <img src="https://lemy.mx/brand/LemyLogoHoriz_White.png" alt="Lemy" width="180" height="90" style="display: block; height: auto; border: 0;" />
      </td>
    </tr>
    <tr>
      <td style="padding: 32px 32px 8px; color: #1F2A22; font-size: 15px; line-height: 1.55;">
        <h2 style="margin: 0 0 12px; font-size: 20px; color: #21382b;">Confirma que eres tú</h2>
        <p style="margin:0 0 6px;">Para continuar, ingresa este código de verificación:</p>
        <p style="margin: 18px 0; font-size: 28px; letter-spacing: 6px; font-weight: 700; color: #21382b;">{{ .Token }}</p>
        
        <p style="margin: 18px 0 0; font-size: 13px; color: #8B978F;">Si tú no hiciste esta solicitud, puedes ignorar este correo con tranquilidad.</p>
      </td>
    </tr>
    <tr>
      <td style="padding: 8px 32px 28px;">
        <div style="border-top: 1px solid #E4E9DF; padding-top: 18px;">
          <p style="margin: 0; font-size: 13px; color: #8B978F;">— El equipo de Lemy</p>
          <p style="margin: 6px 0 0; font-size: 12px; color: #B7C0BA;">Este es un correo automático, no respondas a este mensaje. Si necesitas ayuda, escríbenos a <a href="mailto:hola@lemy.mx" style="color: #8B978F;">hola@lemy.mx</a>.</p>
        </div>
      </td>
    </tr>
  </table>
</div>
